name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload kbfc
        uses: actions/upload-artifact@v4
        with:
          name: kbfc
          path: ./build/kbfc
